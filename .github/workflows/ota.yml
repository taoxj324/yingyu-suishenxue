name: 发布在线更新（OTA）

# 推送代码到 main 分支（且改动涉及 Web 资源）或手动触发时，
# 自动打包 Web 资源并部署到 GitHub Pages，App 端即可检查到新版本。
on:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "css/**"
      - "index.html"
      - "publish/**"
      - ".github/workflows/ota.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 打包更新包并生成 version.json
        run: python3 publish/build_bundle.py --notes "${{ github.event.head_commit.message }}"

      # 把构建产物同步回仓库，供 jsDelivr 镜像读取（GitHub Pages 不可达时的备用通道）。
      # ota-site 不在触发路径内，不会造成循环构建。
      - name: 同步镜像目录（jsDelivr 兜底）
        run: |
          ls -d ota-site/v* 2>/dev/null | sort -V | head -n -3 | xargs -r rm -rf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ota-site
          if git diff --cached --quiet; then
            echo "镜像无变化"
          else
            git commit -m "chore: 同步 OTA 镜像 [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ota-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
